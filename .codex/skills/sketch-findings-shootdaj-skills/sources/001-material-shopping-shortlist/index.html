<!DOCTYPE html>
<!--
  VISUAL PRODUCT SHORTLIST — reusable layout template

  TYPE: layout template / shopping default for Lazada and shopping shortlist reports.

  REUSE (keep as-is in every report):
    - Google Material 3 Standard Feed visual system: semantic tokens, dark-first,
      M3 shape/elevation/spacing scales, Roboto Flex + Material Symbols.
    - Information hierarchy: M3 top app bar with cart badge → functional filter
      chips → responsive product-card grid (3 / 2 / 1 columns).
    - Card structure: large uncropped product photo (whole photo links to the
      listing) with rank dot overlay, title + score chip, price, compact fact
      chips, one-line verdict, decision + in-cart chips, filled "View on Lazada"
      CTA plus tonal cart toggle.
    - Interactions: working filter chips, cart add/remove with live badge,
      persistent app-bar theme toggle (dark default, deliberate light theme),
      state layers + ripples, visible focus rings, 48px targets,
      reduced-motion support, image fallback, no horizontal overflow.

  ADAPT (per report):
    - Title/date in the app bar and <title>.
    - PRODUCTS array: names, images, URLs, prices, scores, facts, verdicts,
      inCart flags, decision keys.
    - Decision/cart labels and accent semantics (DEC map) if the report uses
      different verdict categories.

  INVARIANTS (do not violate):
    - Image-led, 4–8 product cards; direct verified Lazada links; concise text;
      exact verified data only (never invented prices/specs).
    - Dark-first presentation with working light theme.
    - No methodology sections, navigation rail, comparison tables, or charts
      unless the user explicitly requests them.

  SAMPLE DATA: the six PRODUCTS below are real balcony-table examples from the
  approved sketch. They exist only to show the structure — future reports
  replace every product with their own verified data.
-->

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {

    background: var(--surface-container-lowest);
    color: var(--on-surface);

  }
  .page {
    width: 100%; max-width: 1400px; margin: 0 auto;
    background: var(--surface);
    box-shadow: var(--elevation-1);
    min-height: 100vh;
    container-type: inline-size;
    container-name: page;
  }
  .ms {
    font-family: 'Material Symbols Rounded';
    font-weight: normal; font-style: normal;
    font-size: 24px; line-height: 1;
    display: inline-block; vertical-align: middle;
    letter-spacing: normal; text-transform: none;
    white-space: nowrap; word-wrap: normal; direction: ltr;
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    -webkit-font-smoothing: antialiased;
  }
  .ms.fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

  /* ---------- interactive base: state layer + ripple + focus + 48px targets ---------- */
  .ia {
    position: relative;
    overflow: hidden;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    border: none;
    background: none;
    font: inherit;
    color: inherit;
    isolation: isolate;
  }
  .ia::after {
    content: "";
    position: absolute; inset: 0;
    background: currentColor;
    opacity: 0;
    transition: opacity 120ms ease;
    pointer-events: none;
    border-radius: inherit;
  }
  .ia:hover::after { opacity: var(--state-hover); }
  .ia:focus-visible::after { opacity: var(--state-focus); }
  .ia:active::after { opacity: var(--state-press); }
  .ia:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .ia:disabled { cursor: default; opacity: var(--disabled-content); }
  .ripple {
    position: absolute; border-radius: 50%;
    background: currentColor; opacity: .18;
    transform: scale(0); pointer-events: none;
    animation: ripple 480ms ease-out forwards;
  }
  @keyframes ripple { to { transform: scale(2.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .ripple { animation: none; opacity: 0; }
    * { transition-duration: 1ms !important; animation-duration: 1ms !important; }
  }

  /* ---------- shared product bits ---------- */
  .price { font-weight: 700; font-variant-numeric: tabular-nums; }
  .score-chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--primary-container); color: var(--on-primary-container);
    border-radius: var(--shape-s); padding: 2px 8px;
    font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 32px; padding: 0 var(--sp-3);
    border-radius: var(--shape-s);
    border: 1px solid var(--outline);
    font-size: 14px; font-weight: 500;
    color: var(--on-surface-variant);
    background: transparent;

  .chip .ms { font-size: 18px; }
  .chip.on { background: var(--secondary-container); color: var(--on-secondary-container); border-color: transparent; }

  .chip.cart { background: var(--tertiary-container); color: var(--on-tertiary-container); border-color: transparent; }
  .facts { display: flex; flex-wrap: wrap; gap: var(--sp-1); margin: 0; padding: 0; list-style: none; }
  .facts li {
    font-size: 12px; color: var(--on-surface-variant);
    background: var(--surface-container-high);
    border-radius: var(--shape-xs); padding: 3px 8px;
    font-variant-numeric: tabular-nums;

  .verdict { font-size: 14px; color: var(--on-surface-variant); margin: 0; line-height: 1.45; }

    border-radius: var(--shape-full);

    min-height: 64px; padding: 0 var(--sp-4);
    background: var(--surface-container);
    position: sticky; top: 0; z-index: 10;

  .appbar h1 { font-size: 22px; font-weight: 500; margin: 0; flex: 1; font-family: 'Roboto Flex', Roboto, sans-serif; }
  .icon-btn {
    min-width: 48px; min-height: 48px; border-radius: var(--shape-full);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--on-surface-variant); position: relative;
  }
  .cart-badge {
    position: absolute; top: 8px; right: 8px;
    background: var(--tertiary); color: var(--on-tertiary);
    font-size: 11px; font-weight: 700; min-width: 16px; height: 16px;
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    padding: 0 4px; font-variant-numeric: tabular-nums;
  }
  .chip-row {
    display: flex; gap: var(--sp-2); flex-wrap: wrap;
    padding: var(--sp-3) var(--sp-4);
    background: var(--surface-container);
    border-bottom: 1px solid var(--outline-variant);
  }
  .chip-row .chip { min-height: 40px; }
  .grid {
    display: grid; gap: var(--sp-4); padding: var(--sp-4);
    grid-template-columns: repeat(3, 1fr);
  }
  @container page (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @container page (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--surface-container-low);
    border-radius: var(--shape-m);
    overflow: hidden;
    box-shadow: var(--elevation-1);
    display: flex; flex-direction: column;
    transition: box-shadow 160ms ease, transform 160ms ease;
  }
  .card:hover { box-shadow: var(--elevation-3); }
  .card .img-link { aspect-ratio: 4/3; border-radius: 0; }
  .card .body { padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-2); flex: 1; }
  .card .titlerow { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-2); }
  .card h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .card .price { font-size: 18px; }
  .card .chips { display: flex; gap: var(--sp-1); flex-wrap: wrap; }
  .card .actions { display: flex; gap: var(--sp-2); margin-top: auto; padding-top: var(--sp-2); }
  .rankdot {
    position: absolute; top: var(--sp-2); left: var(--sp-2);
    background: var(--scrim); color: #fff;
    border-radius: var(--shape-s); padding: 2px 8px;
    font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .empty {
    grid-column: 1 / -1; text-align: center; padding: var(--sp-8) var(--sp-4);
    color: var(--on-surface-variant);
  }
  .empty .ms { font-size: 48px; opacity: .6; }
</style>
</head>

const DEC = {
  buy:      { label:"Buy",      icon:"check_circle", tone:"tone-buy" },
  keep:     { label:"Keep",     icon:"bookmark",     tone:"tone-keep" },
  consider: { label:"Consider", icon:"help",         tone:"tone-consider" },
  skip:     { label:"Skip",     icon:"block",        tone:"tone-skip" }
};
const thb = n => "฿" + n.toLocaleString("en-US");
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* ---------- theme: dark-first, persisted, manual wins ---------- */
const root = document.documentElement;
const themeIcon = document.getElementById("themeIcon");
function applyTheme(t) {
  root.setAttribute("data-theme", t);
  themeIcon.textContent = t === "dark" ? "light_mode" : "dark_mode";
  localStorage.setItem("shortlist-theme", t);
}
applyTheme(localStorage.getItem("shortlist-theme") || "dark");
document.getElementById("themeToggle").addEventListener("click", () =>
  applyTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark"));

/* ---------- ripple ---------- */
document.addEventListener("pointerdown", e => {
  const el = e.target.closest(".ia");
  if (!el) return;
  const r = el.getBoundingClientRect();
  const d = Math.max(r.width, r.height);
  const s = document.createElement("span");
  s.className = "ripple";
  s.style.width = s.style.height = d + "px";
  s.style.left = (e.clientX - r.left - d/2) + "px";
  s.style.top = (e.clientY - r.top - d/2) + "px";
  el.appendChild(s);
  s.addEventListener("animationend", () => s.remove());
});

/* ---------- image fallback: swap failed photos for neutral placeholder ---------- */
const IMG_FALLBACK = "data:image/svg+xml," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720"><rect width="720" height="720" fill="#3a3a44"/><text x="360" y="380" font-family="sans-serif" font-size="48" fill="#9a9aa6" text-anchor="middle">No photo</text></svg>');
document.addEventListener("error", e => {
  const img = e.target;
  if (img && img.tagName === "IMG" && img.src !== IMG_FALLBACK) img.src = IMG_FALLBACK;
}, true);

/* ---------- cart state ---------- */
const cart = new Set(PRODUCTS.filter(p => p.inCart).map(p => p.rank));
function updateCartBadges() {
  document.querySelectorAll("[data-cartcount]").forEach(b => b.textContent = cart.size);
}
function toggleCart(rank) {
  cart.has(rank) ? cart.delete(rank) : cart.add(rank);
  render();
}

function cartBtn(p) {
  const inCart = cart.has(p.rank);
  return `<button class="ia btn-tonal ${inCart ? "incart" : ""}" data-cart="${p.rank}"
            aria-pressed="${inCart}" aria-label="${inCart ? "Remove from" : "Add to"} cart: ${esc(p.name)}">
            <span class="ms ${inCart ? "fill" : ""}">${inCart ? "shopping_cart" : "add_shopping_cart"}</span>
            ${inCart ? "In cart" : "Add"}
          </button>`;
}
function decChip(p) {
  const d = DEC[p.decision];
  return `<span class="chip ${d.tone}"><span class="ms">${d.icon}</span>${d.label}</span>`;
}
function cartChip(p) {
  return cart.has(p.rank) ? `<span class="chip cart"><span class="ms fill">shopping_cart</span>In cart</span>` : "";
}

/* ---------- feed render + filters ---------- */
let activeFilter = "all";
function render() {
  const grid = document.getElementById("grid");
  const list = PRODUCTS.filter(p =>
    activeFilter === "all" ? true :
    activeFilter === "cart" ? cart.has(p.rank) : p.decision === activeFilter);
  if (!list.length) {
    grid.innerHTML = `<div class="empty"><span class="ms">search_off</span><p>No products match this filter.</p></div>`;
  } else {
    grid.innerHTML = list.map(p => `
      <div class="card">
        <a class="ia img-link" href="${p.url}" target="_blank" rel="noopener"
           aria-label="Open ${esc(p.name)} on Lazada">
          <img src="${p.img}" alt="${esc(p.name)} product photo">
          <span class="rankdot">#${p.rank}</span>
        </a>
        <div class="body">
          <div class="titlerow">
            <h2>${esc(p.name)}</h2>
            <span class="score-chip"><span class="ms" style="font-size:14px">star</span>${p.score.toFixed(1)}</span>
          </div>
          <span class="price">${thb(p.price)}</span>
          <ul class="facts">${p.facts.map(f => `<li>${esc(f)}</li>`).join("")}</ul>
          <p class="verdict">${esc(p.verdict)}</p>
          <div class="chips">${decChip(p)}${cartChip(p)}</div>
          <div class="actions">
            <a class="ia btn-filled" href="${p.url}" target="_blank" rel="noopener">
              <span class="ms">open_in_new</span>View on Lazada</a>
            ${cartBtn(p)}
          </div>
        </div>
      </div>`).join("");
  }
  updateCartBadges();
}
document.getElementById("filterChips").addEventListener("click", e => {
  const b = e.target.closest("[data-filter]");
  if (!b) return;
  activeFilter = b.dataset.filter;
  document.querySelectorAll("#filterChips .chip").forEach(c => c.classList.toggle("on", c === b));
  render();
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-cart]");
  if (b) toggleCart(+b.dataset.cart);
});
render();
</script>
</body>
</html>
