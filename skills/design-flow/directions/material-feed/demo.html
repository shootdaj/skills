<!DOCTYPE html>
<!--
  VISUAL PRODUCT SHORTLIST — reusable layout template

  LOOK DEMO: material-feed, built only from tokens.css, look.css and ripple.js in this folder.
  It is the product-shortlist recipe's starter with its inline CSS and ripple swapped for those files.
  TYPE (of the starter): starter for design-flow's product-shortlist recipe (../../RECIPE.md), the shopping
  default for Lazada and every product shortlist. Look: material-feed (directions/material-feed.md).

  REUSE (keep as-is in every report):
    - Google Material 3 Standard Feed visual system: semantic tokens, dark-first,
      M3 shape/elevation/spacing scales, Roboto Flex + Material Symbols.
    - Information hierarchy: M3 top app bar with cart badge → functional filter
      chips → responsive product-card grid (3 / 2 / 1 columns).
    - Card structure: large uncropped product photo (whole photo links to the
      listing) with rank dot overlay, title + score chip, price, compact fact
      chips, one-line verdict, decision + in-cart chips, filled "View on Lazada"
      CTA plus tonal cart toggle.
    - Interactions: working filter chips, cart add/remove with live badge,
      persistent app-bar theme toggle (dark default, deliberate light theme),
      state layers + ripples, visible focus rings, 48px targets,
      reduced-motion support, image fallback, no horizontal overflow.

  ADAPT (per report):
    - Title/date in the app bar and <title>.
    - PRODUCTS array: names, images, URLs, prices, scores, facts, verdicts,
      inCart flags, decision keys.
    - Decision/cart labels and accent semantics (DEC map) if the report uses
      different verdict categories.

  INVARIANTS (do not violate):
    - Image-led, 4–8 product cards; direct verified Lazada links; concise text;
      exact verified data only (never invented prices/specs).
    - Dark-first presentation with working light theme.
    - No methodology sections, navigation rail, comparison tables, or charts
      unless the user explicitly requests them.

  SAMPLE DATA: the six PRODUCTS below are real balcony-table examples from the
  approved sketch. They exist only to show the structure — future reports
  replace every product with their own verified data.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balcony Table Shortlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300..900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="look.css">
</head>
<body>

<div class="page">
  <main aria-label="Product shortlist">
    <header class="appbar">
      <span class="ms" aria-hidden="true">table_restaurant</span>
      <h1>Balcony Table Shortlist</h1>
      <button class="ia icon-btn" aria-label="Shopping cart">
        <span class="ms">shopping_cart</span>
        <span class="cart-badge" data-cartcount>2</span>
      </button>
      <button class="ia icon-btn" id="themeToggle" aria-label="Toggle light or dark theme">
        <span class="ms" id="themeIcon">light_mode</span>
      </button>
    </header>
    <div class="chip-row" id="filterChips" role="group" aria-label="Filter products">
      <button class="ia chip on" data-filter="all"><span class="ms">filter_list</span>All</button>
      <button class="ia chip" data-filter="buy"><span class="ms">check_circle</span>Buy</button>
      <button class="ia chip" data-filter="keep"><span class="ms">bookmark</span>Keep</button>
      <button class="ia chip" data-filter="consider"><span class="ms">help</span>Consider</button>
      <button class="ia chip" data-filter="skip"><span class="ms">block</span>Skip</button>
      <button class="ia chip" data-filter="cart"><span class="ms">shopping_cart</span>In cart</button>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<script>
/* SAMPLE DATA — replace per report (see ADAPT in the header comment). */
const PRODUCTS = [
  { rank:1, name:"Balcony Decor 80 cm", price:2215, score:9.4,
    facts:["30 × 80 cm","rail up to 16 cm","30 kg"],
    verdict:"Best overall. Proven, adjustable, weather-ready.",
    img:"https://img.lazcdn.com/g/p/903be024ed1d8efaf46a4c3431ff4a99.jpg_720x720q80.jpg_.webp",
    url:"https://www.lazada.co.th/products/pdp-i276372841.html", inCart:false, decision:"buy" },
  { rank:2, name:"Balcony Decor 60 cm", price:1895, score:9.0,
    facts:["30 × 60 cm","rail up to 16 cm","aluminum"],
    verdict:"Safest compact pick.",
    img:"https://img.lazcdn.com/g/p/5cd5d4d37cca7a75fbc234a64a27a89c.jpg_720x720q80.jpg_.webp",
    url:"https://www.lazada.co.th/products/pdp-i276360096.html", inCart:false, decision:"buy" },
  { rank:3, name:"Living_HOME 60 cm", price:1344, score:8.5,
    facts:["60 × 30 cm","folds flat","round or square rail"],
    verdict:"Best value in your cart.",
    img:"https://img.lazcdn.com/g/ff/kf/S9966f4ade4fb4c3d9c292c84377cf391M.png_720x720q80.png_.webp",
    url:"https://www.lazada.co.th/products/i16087746865-s126727912974.html", inCart:true, decision:"keep" },
  { rank:4, name:"TMCG BT002", price:1287, score:8.3,
    facts:["90 cm","rail up to 11 cm","40 kg or more"],
    verdict:"Huge specs for the money.",
    img:"https://img.lazcdn.com/g/ff/kf/S38c7214dcc424a7ca037cfe616b5e65e5.jpg_720x720q80.jpg_.webp",
    url:"https://www.lazada.co.th/products/pdp-i16051784158.html", inCart:false, decision:"consider" },
  { rank:5, name:"Furnism Balcony Bar", price:3134, score:7.9,
    facts:["58 or 90 cm","fixed rail lips","preorder"],
    verdict:"Only for an exact rail fit.",
    img:"https://img.lazcdn.com/g/p/469e3894830ee37103aef6418ae1def9.jpg_720x720q80.jpg_.webp",
    url:"https://www.lazada.co.th/products/pdp-i3146989262.html", inCart:false, decision:"skip" },
  { rank:6, name:"Rustproof 60 × 40 cm", price:1399, score:7.4,
    facts:["60 × 40 cm","mesh top","fit unknown"],
    verdict:"Skip unless depth matters most.",
    img:"https://img.lazcdn.com/g/ff/kf/Sd6bc3361b34f4ccbb02d3db4abcec9d3r.jpg_720x720q80.jpg_.webp",
    url:"https://www.lazada.co.th/products/i16045178851-s126212356425.html", inCart:true, decision:"skip" }
];

const DEC = {
  buy:      { label:"Buy",      icon:"check_circle", tone:"tone-buy" },
  keep:     { label:"Keep",     icon:"bookmark",     tone:"tone-keep" },
  consider: { label:"Consider", icon:"help",         tone:"tone-consider" },
  skip:     { label:"Skip",     icon:"block",        tone:"tone-skip" }
};
const thb = n => "฿" + n.toLocaleString("en-US");
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* ---------- theme: dark-first, persisted, manual wins ---------- */
const root = document.documentElement;
const themeIcon = document.getElementById("themeIcon");
function applyTheme(t) {
  root.setAttribute("data-theme", t);
  themeIcon.textContent = t === "dark" ? "light_mode" : "dark_mode";
  localStorage.setItem("shortlist-theme", t);
}
applyTheme(localStorage.getItem("shortlist-theme") || "dark");
document.getElementById("themeToggle").addEventListener("click", () =>
  applyTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark"));

/* ---------- image fallback: swap failed photos for neutral placeholder ---------- */
const IMG_FALLBACK = "data:image/svg+xml," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720"><rect width="720" height="720" fill="#3a3a44"/><text x="360" y="380" font-family="sans-serif" font-size="48" fill="#9a9aa6" text-anchor="middle">No photo</text></svg>');
document.addEventListener("error", e => {
  const img = e.target;
  if (img && img.tagName === "IMG" && img.src !== IMG_FALLBACK) img.src = IMG_FALLBACK;
}, true);

/* ---------- cart state ---------- */
const cart = new Set(PRODUCTS.filter(p => p.inCart).map(p => p.rank));
function updateCartBadges() {
  document.querySelectorAll("[data-cartcount]").forEach(b => b.textContent = cart.size);
}
function toggleCart(rank) {
  cart.has(rank) ? cart.delete(rank) : cart.add(rank);
  render();
}

function cartBtn(p) {
  const inCart = cart.has(p.rank);
  return `<button class="ia btn-tonal ${inCart ? "incart" : ""}" data-cart="${p.rank}"
            aria-pressed="${inCart}" aria-label="${inCart ? "Remove from" : "Add to"} cart: ${esc(p.name)}">
            <span class="ms ${inCart ? "fill" : ""}">${inCart ? "shopping_cart" : "add_shopping_cart"}</span>
            ${inCart ? "In cart" : "Add"}
          </button>`;
}
function decChip(p) {
  const d = DEC[p.decision];
  return `<span class="chip ${d.tone}"><span class="ms">${d.icon}</span>${d.label}</span>`;
}
function cartChip(p) {
  return cart.has(p.rank) ? `<span class="chip cart"><span class="ms fill">shopping_cart</span>In cart</span>` : "";
}

/* ---------- feed render + filters ---------- */
let activeFilter = "all";
function render() {
  const grid = document.getElementById("grid");
  const list = PRODUCTS.filter(p =>
    activeFilter === "all" ? true :
    activeFilter === "cart" ? cart.has(p.rank) : p.decision === activeFilter);
  if (!list.length) {
    grid.innerHTML = `<div class="empty"><span class="ms">search_off</span><p>No products match this filter.</p></div>`;
  } else {
    grid.innerHTML = list.map(p => `
      <div class="card">
        <a class="ia img-link" href="${p.url}" target="_blank" rel="noopener"
           aria-label="Open ${esc(p.name)} on Lazada">
          <img src="${p.img}" alt="${esc(p.name)} product photo">
          <span class="rankdot">#${p.rank}</span>
        </a>
        <div class="body">
          <div class="titlerow">
            <h2>${esc(p.name)}</h2>
            <span class="score-chip"><span class="ms" style="font-size:14px">star</span>${p.score.toFixed(1)}</span>
          </div>
          <span class="price">${thb(p.price)}</span>
          <ul class="facts">${p.facts.map(f => `<li>${esc(f)}</li>`).join("")}</ul>
          <p class="verdict">${esc(p.verdict)}</p>
          <div class="chips">${decChip(p)}${cartChip(p)}</div>
          <div class="actions">
            <a class="ia btn-filled" href="${p.url}" target="_blank" rel="noopener">
              <span class="ms">open_in_new</span>View on Lazada</a>
            ${cartBtn(p)}
          </div>
        </div>
      </div>`).join("");
  }
  updateCartBadges();
}
document.getElementById("filterChips").addEventListener("click", e => {
  const b = e.target.closest("[data-filter]");
  if (!b) return;
  activeFilter = b.dataset.filter;
  document.querySelectorAll("#filterChips .chip").forEach(c => c.classList.toggle("on", c === b));
  render();
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-cart]");
  if (b) toggleCart(+b.dataset.cart);
});
render();
</script>
<script src="ripple.js"></script>
</body>
</html>
