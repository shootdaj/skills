<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data flow starter</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&family=Martian+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* page tokens (Obsidian, dark first). flow3d.js reads these; any house palette works the same way */
:root,:root[data-theme="dark"]{--bg:#0A0C11;--s1:#11141B;--s2:#171B24;--s3:#1F2430;--line:rgba(255,255,255,.085);--line2:rgba(255,255,255,.16);
 --txt:#EDEEF2;--txt2:#A6ACB8;--txt3:#838A98;--red:#4C7DFF;--red-txt:#8DB0FF;--ok:#3DDC97;--c1:#5DD3FF;--c2:#9BE15D;--c3:#A597FF;--c4:#FFD93D;--c5:#FF6B6B;
 --f:'Manrope',system-ui,sans-serif;--mono:'Martian Mono',ui-monospace,monospace;color-scheme:dark}
:root[data-theme="light"]{--bg:#F6F7F9;--s1:#FFFFFF;--s2:#EEF0F4;--s3:#E2E5EB;--line:rgba(0,0,0,.1);--line2:rgba(0,0,0,.2);
 --txt:#14171F;--txt2:#4A5160;--txt3:#6B7280;--red:#2F5FE0;--red-txt:#2449B8;--ok:#1F8A4C;--c1:#0E7FB0;--c2:#4C8A12;--c3:#6B4FE0;--c4:#A87A00;--c5:#D23B3B;color-scheme:light}
body{margin:0;background:var(--bg);color:var(--txt);font:400 16px/1.6 var(--f)}
main{max-width:1180px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:26px;line-height:1.25;margin:0 0 6px}
p.note{margin:0 0 20px;color:var(--txt)}
figcaption{margin-top:10px;font-weight:600}
.src{font-size:13px;color:var(--txt2)}
.theme{float:right;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--s2);color:var(--txt);font:600 14px var(--f);cursor:pointer}
</style>
</head>
<body>
<main>
<button class="theme" type="button" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'">Light or dark</button>
<h1>How one clip becomes searchable</h1>
<p class="note">A pipeline with a branch and a merge: two cloud jobs run side by side, and search joins their results.</p>
<figure style="margin:0">
 <div id="pipe"></div>
 <figcaption>Two cloud jobs run side by side; search merges both.</figcaption>
 <p class="src">Data: the footage-search plan, Luminatlas, October 2026. Swap in your own places and paths.</p>
</figure>
</main>
<script src="../flow3d.js"></script>
<script>
Flow3D.mount('#pipe', {
  title: 'How one clip becomes searchable',
  camera: { az: .42, el: .52, dist: 23 },
  zones: [
    { x: [-14.6, -7.6], z: [-2.4, 2.4], hue: '--c4', label: 'On your Mac' },
    { x: [-7.2, 4.8], z: [-5.2, 5.2], hue: '--c1', label: 'In the cloud' },
    { x: [5.2, 12.8], z: [-2.4, 2.4], hue: '--c5', label: 'On every machine' }
  ],
  places: [
    { id: 'card', at: [-13, 0, 0], shape: 'slab', hue: '--c4', label: 'Your card', sub: 'shot today' },
    { id: 'mac', at: [-9.3, 0, 0], shape: 'box', hue: '--c4', label: 'Your Mac', sub: 'imports in seconds' },
    { id: 'storage', at: [-5.4, 0, 0], shape: 'discs', hue: '--c1', label: 'Cloud storage', sub: 'uploads in minutes' },
    { id: 'server', at: [-1.6, 0, 0], shape: 'box', hue: '--c1', label: 'Cloud server', sub: 'queues two jobs' },
    { id: 'worker', at: [2.4, 0, -3.3], shape: 'pillar', hue: '--c2', label: 'Fingerprints', sub: 'within the hour', size: .8 },
    { id: 'gemini', at: [2.4, 0, 3.3], shape: 'gem', hue: '--c3', label: 'Description', sub: 'by morning' },
    { id: 'index', at: [7, 0, 0], shape: 'orb', hue: '--c5', label: 'Search index', sub: 'merges both' },
    { id: 'result', at: [11, 0, 0], shape: 'slab', hue: '--c5', label: 'Result at 0:44', sub: 'player opens there' }
  ],
  paths: [
    { from: 'card', to: 'mac' }, { from: 'mac', to: 'storage' }, { from: 'storage', to: 'server' },
    { from: 'server', to: 'worker' }, { from: 'server', to: 'gemini' },
    { from: 'worker', to: 'index' }, { from: 'gemini', to: 'index' }, { from: 'index', to: 'result', weight: .8 }
  ],
  tour: [
    { to: 'card', say: 'The clip sits on your card.' },
    { to: 'mac' }, { to: 'storage' }, { to: 'server' },
    { to: ['worker', 'gemini'], dist: 15, el: .62, hold: 1.4, say: 'Two cloud jobs run side by side.' },
    { to: 'index', say: 'Search merges both results.' },
    { to: 'result', dist: 8.5, hold: 1.4 }
  ]
});
</script>
</body>
</html>
