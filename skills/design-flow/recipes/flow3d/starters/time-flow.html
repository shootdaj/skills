<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Time flow starter</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&family=Martian+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root,:root[data-theme="dark"]{--bg:#0A0C11;--s1:#11141B;--s2:#171B24;--s3:#1F2430;--line:rgba(255,255,255,.085);--line2:rgba(255,255,255,.16);
 --txt:#EDEEF2;--txt2:#A6ACB8;--txt3:#838A98;--red:#4C7DFF;--red-txt:#8DB0FF;--ok:#3DDC97;--c1:#5DD3FF;--c2:#9BE15D;--c3:#A597FF;--c4:#FFD93D;--c5:#FF6B6B;
 --f:'Manrope',system-ui,sans-serif;--mono:'Martian Mono',ui-monospace,monospace;color-scheme:dark}
:root[data-theme="light"]{--bg:#F6F7F9;--s1:#FFFFFF;--s2:#EEF0F4;--s3:#E2E5EB;--line:rgba(0,0,0,.1);--line2:rgba(0,0,0,.2);
 --txt:#14171F;--txt2:#4A5160;--txt3:#6B7280;--red:#2F5FE0;--red-txt:#2449B8;--ok:#1F8A4C;--c1:#0E7FB0;--c2:#4C8A12;--c3:#6B4FE0;--c4:#A87A00;--c5:#D23B3B;color-scheme:light}
body{margin:0;background:var(--bg);color:var(--txt);font:400 16px/1.6 var(--f)}
main{max-width:1180px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:26px;line-height:1.25;margin:0 0 6px}
p.note{margin:0 0 20px}
figcaption{margin-top:10px;font-weight:600}
.src{font-size:13px;color:var(--txt2)}
.theme{float:right;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--s2);color:var(--txt);font:600 14px var(--f);cursor:pointer}
</style>
</head>
<body>
<main>
<button class="theme" type="button" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'">Light or dark</button>
<h1>When each report rule was decided</h1>
<p class="note">A timeline as a path: days are stations spaced by real dates, and the camera flies along it. Rules decided on the same day fan out beside their day.</p>
<figure style="margin:0">
 <div id="time"></div>
 <figcaption>Eight dated rules over four days; none dated October 9.</figcaption>
 <p class="src">Data: the dated "Why" lines in design-flow's report recipe. Days are 8 units apart, so gaps are honest.</p>
</figure>
</main>
<script src="../flow3d.js"></script>
<script>
/* real data: day → rules. x is the date (8 units a day); rules from one day fan out sideways, since their hour was not recorded */
const DAYS = [
  { id: 'd8', day: 8, rules: [['No stat tiles', 'bullets lead instead'], ['Never italic', 'weight or colour only'], ['Shorter reports', 'less to read'], ['Plain-English top', 'no label, just text']] },
  { id: 'd10', day: 10, rules: [['Lead statement', 'plain, calm highlights'], ['Context brief', 'Ask knows why']] },
  { id: 'd11', day: 11, rules: [['Sections as needed', 'chapter cap dropped'], ['3D flow figures', 'this recipe']] }
];
const X = d => (d - 9.5) * 8, HUE = ['--c1', '--c2', '--c3', '--c4'];
const places = [], paths = [];
DAYS.forEach(D => {
  places.push({ id: D.id, at: [X(D.day), 0, 0], shape: 'orb', hue: '--red', label: 'Oct ' + D.day, sub: D.rules.length + ' rules', size: 1.1 });
  D.rules.forEach(([t, s], i) => {
    const id = D.id + '-' + i, z = (i - (D.rules.length - 1) / 2) * 3.4;
    places.push({ id, at: [X(D.day), 0, z + Math.sign(z || 1) * 1.6], shape: 'slab', hue: HUE[i % 4], label: t, sub: s });
    paths.push({ from: D.id, to: id, weight: .15, flow: { speed: 1.6, comets: 2 } });
  });
});
paths.push({ from: 'd8', to: 'd10', via: [[X(9), 0, 0]], hue: '--red', weight: .9 }, { from: 'd10', to: 'd11', via: [[X(10.5), 0, 0]], hue: '--red', weight: .9 });
Flow3D.mount('#time', {
  title: 'When each report rule was decided',
  camera: { az: .32, el: .55, dist: 34 },
  places, paths,
  marks: [{ at: [X(9), 0, 2.2], text: 'Oct 9', sub: 'none recorded' }],
  tour: DAYS.map(D => ({ to: D.id, dist: 15, az: 1.2, el: .5, move: 1.6, hold: 2.2, say: 'Oct ' + D.day + ': ' + D.rules.map(r => r[0]).join(', ') + '.' })),
  tourHue: '--red'
});
</script>
</body>
</html>
