<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inspiration picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root,[data-theme="dark"]{--bg:#111013;--s1:#1A191E;--s2:#232228;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.18);--txt:#EEECF1;--txt2:#A7A3B0;--acc:#FF5A4E;--acc2:#FFB23F;--ok:#5CD68A;--shadow:0 18px 40px -18px rgba(0,0,0,.7);color-scheme:dark}
[data-theme="light"]{--bg:#F6F4EF;--s1:#FFFFFF;--s2:#EEEBE4;--line:rgba(0,0,0,.09);--line2:rgba(0,0,0,.2);--txt:#1C1A20;--txt2:#5D5966;--acc:#E0392D;--acc2:#B7700A;--ok:#1F8A4C;--shadow:0 18px 36px -20px rgba(0,0,0,.28);color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-padding-top:140px}
body{margin:0;background:var(--bg);color:var(--txt);font:400 15px/1.5 'Familjen Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:'Martian Mono',ui-monospace,monospace}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* top */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.row{max-width:1480px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ttl{display:flex;flex-direction:column;min-width:0;margin-right:auto}.ttl small{font:500 12px 'Martian Mono',monospace;color:var(--txt2);letter-spacing:.04em;text-transform:uppercase}.ttl b{font:700 22px/1.15 'Familjen Grotesk';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48vw}
.meter{display:flex;align-items:center;gap:10px;font:500 13px 'Martian Mono',monospace;color:var(--txt2)}.bar{width:140px;height:6px;border-radius:9px;background:var(--s2);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:9px;transition:width .4s cubic-bezier(.34,1.56,.64,1)}
.btn{min-height:44px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:1px solid var(--line2);background:var(--s1);cursor:pointer;font-weight:500;transition:transform .25s cubic-bezier(.34,1.56,.64,1),border-color .15s,background .15s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);border-color:var(--txt2)}.btn:active{transform:scale(.95);transition-duration:.06s}.btn.icon{width:44px;padding:0;justify-content:center}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{border-color:var(--acc)}
.search{position:relative;flex:1 1 220px;max-width:340px}.search input{width:100%;min-height:44px;border-radius:999px;border:1px solid var(--line2);background:var(--s1);padding:0 16px 0 40px;font:inherit;color:var(--txt)}.search svg{position:absolute;left:14px;top:13px;color:var(--txt2)}
.search kbd{position:absolute;right:12px;top:11px}
kbd{font:500 12px 'Martian Mono',monospace;padding:2px 7px;border-radius:6px;border:1px solid var(--line2);background:var(--s2);color:var(--txt2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding-top:0}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:transparent;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:500;transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .15s,color .15s}
.chip:hover{transform:translateY(-2px)}.chip .c{font:500 12px 'Martian Mono',monospace;color:var(--txt2)}.chip[aria-pressed="true"]{background:var(--txt);color:var(--bg);border-color:var(--txt)}.chip[aria-pressed="true"] .c{color:var(--bg);opacity:.7}
/* grid */
main{max-width:1480px;margin:0 auto;padding:18px 20px 140px}
.grid{columns:4 300px;column-gap:16px}
.card{break-inside:avoid;margin:0 0 16px;position:relative;border-radius:14px;overflow:hidden;background:var(--s1);border:1px solid var(--line);cursor:zoom-in;outline:none;animation:rise .5s cubic-bezier(.2,.7,.1,1) both;animation-delay:calc(var(--n,0)*28ms);transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .25s,opacity .3s,border-color .2s}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.card:hover,.card.focus{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--line2)}
.card.focus{outline:2px solid var(--acc);outline-offset:2px}
.card img{display:block;width:100%;height:auto;background:var(--s2)}
.card .meta{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px;color:var(--txt2)}.card .meta b{font:500 12px 'Martian Mono',monospace;color:var(--txt);white-space:nowrap}.card .meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{position:absolute;top:10px;right:10px;display:flex;gap:6px;opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .25s}
.card:hover .acts,.card.focus .acts,.card.liked .acts{opacity:1;transform:none}
.acts button{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:rgba(10,10,12,.72);color:#fff;backdrop-filter:blur(6px);transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .15s}
.acts button:hover{transform:scale(1.08)}.acts button:active{transform:scale(.9)}
.card.liked{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}.card.liked .like{background:var(--acc)}.card.liked .like svg{fill:#fff}
.card.skipped{opacity:.28}.card.skipped:hover{opacity:.7}
.card.link{cursor:pointer;min-height:160px;display:grid;place-items:center;text-align:center;padding:26px 18px;background:repeating-linear-gradient(135deg,var(--s1) 0 14px,var(--s2) 14px 28px)}
.card.link b{display:block;font:700 18px 'Familjen Grotesk';margin-bottom:6px}.card.link small{color:var(--txt2)}
.note-dot{position:absolute;left:10px;top:10px;min-height:28px;padding:0 10px;border-radius:999px;background:var(--acc2);color:#1A1204;font:600 12px 'Familjen Grotesk';display:none;align-items:center}
.card.has-note .note-dot{display:inline-flex}
.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.browse{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font:500 13px 'Familjen Grotesk';color:var(--txt2)}.browse a{min-height:38px;padding:0 12px;border-radius:999px;border:1px dashed var(--line2);display:inline-flex;align-items:center;gap:6px;color:var(--txt);text-decoration:none;transition:transform .25s cubic-bezier(.34,1.56,.64,1),border-color .15s}.browse a:hover{transform:translateY(-2px);border-color:var(--acc)}.browse a small{color:var(--txt2);font-size:12px}
.empty{padding:80px 20px;text-align:center;color:var(--txt2)}
/* tray */
.tray{position:fixed;left:50%;bottom:16px;transform:translateX(-50%) translateY(140%);z-index:30;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-radius:20px;background:var(--s1);border:1px solid var(--line2);box-shadow:var(--shadow);max-width:calc(100vw - 24px);transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.tray.show{transform:translateX(-50%)}
.tray .lbl{font:600 13px 'Familjen Grotesk';white-space:nowrap}.tray .lbl span{font-family:'Martian Mono';color:var(--acc)}
.thumbs{display:flex;gap:6px;overflow-x:auto;max-width:46vw;scrollbar-width:none}
.thumbs button{flex:none;width:56px;height:44px;border-radius:9px;border:1px solid var(--line2);padding:0;overflow:hidden;cursor:pointer;background:var(--s2)}.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(6,6,8,.82);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:24px}
.ov.show{display:flex;animation:fade .2s}@keyframes fade{from{opacity:0}}
.lb{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;width:min(1400px,100%);max-height:calc(100vh - 48px)}
.lb .pic{display:grid;place-items:center;min-height:0}.lb .pic img{max-width:100%;max-height:calc(100vh - 48px);border-radius:14px;box-shadow:var(--shadow);animation:zoom .3s cubic-bezier(.2,.7,.1,1)}@keyframes zoom{from{opacity:0;transform:scale(.96)}}
.side{background:var(--s1);border:1px solid var(--line2);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;color:var(--txt);overflow:auto}
.side h3{margin:0;font:700 19px/1.2 'Familjen Grotesk'}.side .src{font:500 12px 'Martian Mono';color:var(--txt2);text-transform:uppercase;letter-spacing:.05em}
.side textarea{min-height:110px;border-radius:12px;border:1px solid var(--line2);background:var(--s2);color:var(--txt);padding:10px 12px;font:inherit;resize:vertical}
.side .tags{display:flex;flex-wrap:wrap;gap:6px}.side .tags button{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-size:13px}.side .tags button[aria-pressed="true"]{background:var(--acc2);color:#1A1204;border-color:var(--acc2)}
.side .nav{display:flex;gap:8px;margin-top:auto}
.cmp{width:min(1500px,100%);max-height:calc(100vh - 48px);overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;background:var(--s1);border:1px solid var(--line2);border-radius:18px;padding:16px}
.cmp figure{margin:0}.cmp img{width:100%;border-radius:12px;display:block}.cmp figcaption{font-size:13px;color:var(--txt2);padding-top:6px}.cmp figcaption b{color:var(--txt)}
.help{background:var(--s1);border:1px solid var(--line2);border-radius:18px;padding:22px 26px;min-width:320px;color:var(--txt)}.help h3{margin:0 0 12px;font:700 20px 'Familjen Grotesk'}.help table{border-collapse:collapse}.help td{padding:6px 14px 6px 0}.help td:first-child{white-space:nowrap}
.toast{position:fixed;left:50%;top:92px;transform:translateX(-50%) translateY(-20px);opacity:0;z-index:60;background:var(--txt);color:var(--bg);padding:10px 14px;border-radius:999px;font-weight:500;display:flex;gap:12px;align-items:center;transition:opacity .2s,transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}.toast button{background:none;border:0;color:var(--acc);font-weight:700;cursor:pointer;min-height:32px}
.x{position:fixed;top:14px;right:14px;z-index:55}
@media (max-width:900px){.lb{grid-template-columns:1fr}.side{max-height:40vh}.ttl b{max-width:80vw}.thumbs{max-width:40vw}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
 <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>

 <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>

 <symbol id="i-cols" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="18" rx="1"/></symbol>

</svg>
<header class="top">
 <div class="row">
  <div class="ttl"><small>Inspiration · <span id="kind"></span></small><b id="q"></b></div>
  <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="find" type="search" placeholder="Filter by words" aria-label="Filter shots by words"><kbd>/</kbd></label>
  <div class="meter" aria-live="polite"><span id="count">0 liked</span><span class="bar"><i id="barfill"></i></span></div>
  <button class="btn icon" id="helpBtn" type="button" aria-label="Keyboard shortcuts"><svg class="i"><use href="#i-kbd"/></svg></button>
  <button class="btn icon" id="themeBtn" type="button" aria-label="Switch theme"><svg class="i"><use href="#i-sun"/></svg></button>
  <button class="btn pri" id="doneBtn" type="button"><svg class="i"><use href="#i-check"/></svg>Done</button>
 </div>
 <div class="row chips" id="chips" role="toolbar" aria-label="Filter by source"></div>
 <div class="row browse" id="browse" aria-label="More sources to browse in Chrome"></div>
</header>
<main><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>Nothing matches. Clear the filter or pick another source.</div></main>
<div class="tray" id="tray" aria-label="Liked shots"><span class="lbl"><span id="tn">0</span> liked</span><div class="thumbs" id="thumbs"></div>
 <button class="btn" id="cmpBtn" type="button"><svg class="i"><use href="#i-cols"/></svg>Compare</button>
 <button class="btn" id="copyBtn" type="button">Copy picks</button></div>
<div class="ov" id="lbox" role="dialog" aria-modal="true" aria-label="Shot detail"><div class="lb"><div class="pic"><img id="lbImg" alt=""></div>
 <aside class="side"><span class="src" id="lbSrc"></span><h3 id="lbTitle"></h3>
  <div class="tags" id="lbTags" aria-label="What you like about it"></div>
  <textarea id="lbNote" placeholder="Why this one? (optional, the agent reads it)"></textarea>
  <div class="nav"><button class="btn icon" id="lbPrev" type="button" aria-label="Previous"><svg class="i"><use href="#i-left"/></svg></button>
   <button class="btn" id="lbLike" type="button"><svg class="i"><use href="#i-heart"/></svg><span>Like</span></button>
   <a class="btn icon" id="lbOpen" target="_blank" rel="noopener" aria-label="Open original"><svg class="i"><use href="#i-ext"/></svg></a>
   <button class="btn icon" id="lbNext" type="button" aria-label="Next"><svg class="i"><use href="#i-right"/></svg></button></div></aside></div></div>
<div class="ov" id="cmp" role="dialog" aria-modal="true" aria-label="Compare liked shots"><div class="cmp" id="cmpBody"></div></div>
<div class="ov" id="help" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts"><div class="help"><h3>Shortcuts</h3><table>
 <tr><td><kbd>←</kbd> <kbd>→</kbd> or <kbd>J</kbd> <kbd>K</kbd></td><td>Move between shots</td></tr><tr><td><kbd>L</kbd> or <kbd>Space</kbd></td><td>Like or unlike</td></tr>
 <tr><td><kbd>X</kbd></td><td>Skip (fades it out)</td></tr><tr><td><kbd>Enter</kbd></td><td>Open large, add a note</td></tr><tr><td><kbd>O</kbd></td><td>Open the original site</td></tr>
 <tr><td><kbd>U</kbd></td><td>Undo last action</td></tr><tr><td><kbd>C</kbd></td><td>Compare liked shots</td></tr><tr><td><kbd>/</kbd></td><td>Filter by words</td></tr><tr><td><kbd>Esc</kbd></td><td>Close</td></tr></table></div></div>
<button class="btn icon x" id="xBtn" type="button" aria-label="Close" hidden><svg class="i"><use href="#i-x"/></svg></button>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="undoBtn" type="button">Undo</button></div>
<script>
const BOARD=/*__BOARD__*/null||{query:'demo',kind:'all',sources:[],items:[]};
const API='http://127.0.0.1:7331', KEY='inspire:'+BOARD.query+':'+(BOARD.created||'');
const TAGS=['Layout','Colour','Type','Motion','Data viz','Density','Navigation','Illustration'];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let st={liked:{},skipped:{},notes:{},tags:{}}; try{Object.assign(st,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
let src='all', words='', focusI=-1, undo=null, lbI=-1;
const items=BOARD.items;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){};sync()};
function picks(){return items.filter(i=>st.liked[i.id]).map(i=>({id:i.id,source:i.sourceName,title:i.title,href:i.href,img:i.img,note:st.notes[i.id]||'',tags:st.tags[i.id]||[]}))}
let syncT; function sync(){clearTimeout(syncT);syncT=setTimeout(()=>{fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({component:'inspire',design:JSON.stringify({query:BOARD.query,picks:picks()}),label:'inspiration picks'})}).catch(()=>{})},300)}
$('#q').textContent=BOARD.query; $('#kind').textContent=BOARD.kind; document.title='Inspiration · '+BOARD.query;
function el(tag,attrs,kids){const e=document.createElement(tag);for(const k in attrs||{}){if(k==='text')e.textContent=attrs[k];else e.setAttribute(k,attrs[k])}(kids||[]).forEach(c=>e.appendChild(c));return e}
function icon(id){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','i');const u=document.createElementNS('http://www.w3.org/2000/svg','use');u.setAttribute('href','#'+id);s.appendChild(u);return s}
function chips(){const c=$('#chips');c.replaceChildren();const counts={};shotItems().forEach(i=>counts[i.source]=(counts[i.source]||0)+1);
 const dk=shotItems().filter(i=>i.tone==='dark').length,lt=shotItems().filter(i=>i.tone==='light').length;
 const list=[['all','All',shotItems().length],['liked','Liked',Object.keys(st.liked).length],...(dk&&lt?[['tone:dark','Dark',dk],['tone:light','Light',lt]]:[]),...BOARD.sources.filter(s=>counts[s.id]).map(s=>[s.id,s.name,counts[s.id]])];
 list.forEach(([id,name,n])=>{const b=el('button',{class:'chip',type:'button','aria-pressed':String(src===id)},[el('span',{text:name}),el('span',{class:'c',text:String(n)})]);b.onclick=()=>{src=id;render()};c.appendChild(b)})}
function shotItems(){return items.filter(i=>i.kind!=='link')}
function browse(){const b=$('#browse');const L=items.filter(i=>i.kind==='link');b.hidden=!L.length;b.replaceChildren(el('span',{text:'Also browse'}),...L.map(i=>{const a=el('a',{href:i.href,target:'_blank',rel:'noopener'},[el('span',{text:i.sourceName}),el('small',{text:i.title})]);a.appendChild(icon('i-ext'));return a}))}
function visible(){const w=words.toLowerCase();return shotItems().filter(i=>(src==='all'||(src==='liked'?st.liked[i.id]:src.startsWith('tone:')?i.tone===src.slice(5):i.source===src))&&(!w||(i.title+' '+i.sourceName+' '+(st.notes[i.id]||'')).toLowerCase().includes(w)))}
function card(i,n){const liked=!!st.liked[i.id],sk=!!st.skipped[i.id];
 const c=el('div',{class:'card'+(i.kind==='link'?' link':'')+(liked?' liked':'')+(sk?' skipped':'')+(st.notes[i.id]?' has-note':''),tabindex:'0','data-id':i.id,style:'--n:'+Math.min(n,24),role:'group','aria-label':i.title+', '+i.sourceName+(liked?', liked':'')});
 if(i.kind==='link'){c.appendChild(el('div',{},[el('b',{text:i.sourceName}),el('small',{text:i.title})]));c.onclick=()=>window.open(i.href,'_blank','noopener');return c}
 const img=el('img',{src:i.img,alt:i.title,loading:'lazy'});if(i.w&&i.h){img.width=i.w;img.height=i.h}img.addEventListener('error',()=>{c.remove()});c.appendChild(img);
 c.appendChild(el('span',{class:'note-dot',text:'Note'}));
 c.appendChild(el('div',{class:'meta'},[el('b',{text:i.sourceName}),el('span',{text:i.title})]));
 const like=el('button',{class:'like',type:'button','aria-label':liked?'Unlike':'Like','aria-pressed':String(liked)},[icon('i-heart')]);like.onclick=e=>{e.stopPropagation();toggleLike(i.id,like)};
 const skip=el('button',{class:'skip',type:'button','aria-label':sk?'Unskip':'Skip'},[icon('i-x')]);skip.onclick=e=>{e.stopPropagation();toggleSkip(i.id)};
 const open=el('a',{href:i.href,target:'_blank',rel:'noopener','aria-label':'Open original'},[icon('i-ext')]);open.onclick=e=>e.stopPropagation();
 const acts=el('div',{class:'acts'},[like,skip]);acts.appendChild(el('button',{type:'button','aria-label':'Open original'},[icon('i-ext')]));acts.lastChild.onclick=e=>{e.stopPropagation();window.open(i.href,'_blank','noopener')};
 c.appendChild(acts);c.onclick=()=>openLb(i.id);return c}
function render(){chips();browse();const v=visible();const g=$('#grid');g.replaceChildren(...v.map(card));$('#empty').hidden=v.length>0;tray();focusI=-1}
function tray(){const p=picks();$('#tn').textContent=p.length;$('#count').textContent=p.length+' liked';$('#barfill').style.width=Math.min(100,p.length/Math.max(6,items.filter(i=>i.kind!=='link').length*.25)*100)+'%';
 $('#tray').classList.toggle('show',p.length>0);$('#thumbs').replaceChildren(...p.filter(x=>x.img).map(x=>{const b=el('button',{type:'button','aria-label':'Open '+x.title},[el('img',{src:x.img,alt:''})]);b.onclick=()=>openLb(x.id);return b}));
 document.title=(p.length?'LIKED '+p.length+' · ':'')+'Inspiration · '+BOARD.query}
function toast(msg,fn){$('#toastMsg').textContent=msg;undo=fn;$('#undoBtn').hidden=!fn;const t=$('#toast');t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}
function toggleLike(id,btn){const was=!!st.liked[id];if(was)delete st.liked[id];else{st.liked[id]=Date.now();delete st.skipped[id]}save();const c=document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
 if(c){c.classList.toggle('liked',!was);c.classList.remove('skipped');const b=btn||c.querySelector('.like');if(b){b.setAttribute('aria-pressed',String(!was));b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}}tray();chips();
 toast(was?'Unliked':'Liked',()=>{if(was)st.liked[id]=Date.now();else delete st.liked[id];save();render()})}
function toggleSkip(id){const was=!!st.skipped[id];if(was)delete st.skipped[id];else{st.skipped[id]=1;delete st.liked[id]}save();render();toast(was?'Back in':'Skipped',()=>{if(was)st.skipped[id]=1;else delete st.skipped[id];save();render()})}
function cards(){return $$('.card')}
function focus(n){const cs=cards();if(!cs.length)return;focusI=(n+cs.length)%cs.length;cs.forEach(c=>c.classList.remove('focus'));const c=cs[focusI];c.classList.add('focus');c.focus({preventScroll:true});c.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
function shots(){return visible().filter(i=>i.kind!=='link')}
function openLb(id){const list=shots();lbI=list.findIndex(i=>i.id===id);if(lbI<0)return;fillLb();show('#lbox')}
function fillLb(){const i=shots()[lbI];if(!i)return;$('#lbImg').src=i.img;$('#lbImg').alt=i.title;$('#lbSrc').textContent=i.sourceName;$('#lbTitle').textContent=i.title;$('#lbOpen').href=i.href;$('#lbNote').value=st.notes[i.id]||'';
 $('#lbLike').querySelector('span').textContent=st.liked[i.id]?'Liked':'Like';$('#lbLike').classList.toggle('pri',!!st.liked[i.id]);
 const t=$('#lbTags');t.replaceChildren(...TAGS.map(g=>{const on=(st.tags[i.id]||[]).includes(g);const b=el('button',{type:'button','aria-pressed':String(on),text:g});b.onclick=()=>{const a=new Set(st.tags[i.id]||[]);a.has(g)?a.delete(g):a.add(g);st.tags[i.id]=[...a];if(a.size&&!st.liked[i.id])st.liked[i.id]=Date.now();save();fillLb();render()};return b}))}
$('#lbNote').addEventListener('input',e=>{const i=shots()[lbI];if(!i)return;const v=e.target.value.trim();if(v){st.notes[i.id]=v;if(!st.liked[i.id])st.liked[i.id]=Date.now()}else delete st.notes[i.id];save()});
$('#lbLike').onclick=()=>{const i=shots()[lbI];toggleLike(i.id);fillLb()};$('#lbPrev').onclick=()=>{lbI=(lbI-1+shots().length)%shots().length;fillLb()};$('#lbNext').onclick=()=>{lbI=(lbI+1)%shots().length;fillLb()};
function show(s){$$('.ov').forEach(o=>o.classList.remove('show'));$(s).classList.add('show');$('#xBtn').hidden=false}
function closeAll(){if(!$('.ov.show'))return false;$$('.ov').forEach(o=>o.classList.remove('show'));$('#xBtn').hidden=true;render();return true}
$$('.ov').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeAll()}));$('#xBtn').onclick=closeAll;
function compare(){const p=picks().filter(x=>x.img);if(!p.length){toast('Like a few shots first');return}$('#cmpBody').replaceChildren(...p.map(x=>el('figure',{},[el('img',{src:x.img,alt:x.title}),el('figcaption',{},[el('b',{text:x.source+' '}),document.createTextNode(x.note||x.title)])])));show('#cmp')}
$('#cmpBtn').onclick=compare;
$('#copyBtn').onclick=async()=>{const t=JSON.stringify({query:BOARD.query,picks:picks()},null,1);try{await navigator.clipboard.writeText(t);toast('Picks copied')}catch(e){toast('Copy blocked; picks are saved in this browser')}};
$('#doneBtn').onclick=()=>{sync();document.title='INSPIRE DONE '+picks().length+' · '+BOARD.query;toast(picks().length+' picks sent. Tell the agent you are done.')};
$('#helpBtn').onclick=()=>show('#help');
$('#themeBtn').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('inspire-theme',r.dataset.theme)}catch(e){}};
try{const t=localStorage.getItem('inspire-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
$('#undoBtn').onclick=()=>{if(undo){const f=undo;undo=null;f();$('#toast').classList.remove('show')}};
$('#find').addEventListener('input',e=>{words=e.target.value;render()});
addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
 if(e.key==='Escape'){if(!closeAll()&&typing)document.activeElement.blur();return}
 if(typing)return;
 const lb=$('#lbox').classList.contains('show');
 if(e.key==='/'){e.preventDefault();$('#find').focus();return}
 if(e.key==='?'){show('#help');return}
 if(lb){if(e.key==='ArrowRight'||e.key==='k')$('#lbNext').click();else if(e.key==='ArrowLeft'||e.key==='j')$('#lbPrev').click();else if(e.key==='l'||e.key===' '){e.preventDefault();$('#lbLike').click()}else if(e.key==='o')window.open($('#lbOpen').href,'_blank','noopener');return}
 const cs=cards();const cur=cs[focusI];const id=cur&&cur.dataset.id;
 if(['ArrowRight','ArrowDown','k'].includes(e.key)){e.preventDefault();focus(focusI+1)}
 else if(['ArrowLeft','ArrowUp','j'].includes(e.key)){e.preventDefault();focus(focusI<0?0:focusI-1)}
 else if((e.key==='l'||e.key===' ')&&id){e.preventDefault();toggleLike(id)}
 else if(e.key==='x'&&id){toggleSkip(id);focus(focusI)}
 else if(e.key==='Enter'&&id){openLb(id)}
 else if(e.key==='o'&&id){const i=items.find(x=>x.id===id);window.open(i.href,'_blank','noopener')}
 else if(e.key==='u'&&undo)$('#undoBtn').click()
 else if(e.key==='c')compare()});
render();
</script>
</body>
</html>
